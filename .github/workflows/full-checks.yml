name: Full checks

# Manual-only: Playwright, SEO/AdSense/budget/page-checklist audits, proof, Lighthouse.
# Owner runs these locally before opening PRs; use this workflow when needed in Actions.
on:
  workflow_dispatch:

concurrency:
  group: full-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://docuklin.com
  PUBLIC_SITE_NAME: Docuklin
  PUBLIC_SITE_SHORT_NAME: Docuklin
  PUBLIC_SITE_URL_PAYMENT_FEES: https://payment-fee-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_BUSINESS_DOCS: https://docuklin.com
  PUBLIC_SITE_URL_HOME_GARDEN: https://getyardtally.com
  PUBLIC_SITE_URL_FIBER_ARTS: https://fiber-arts-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_PET: https://pet-calculators.hammadiqbal117.workers.dev
  NPM_CONFIG_PREFER_OFFLINE: 'true'

jobs:
  full-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Cache Astro / Vite build caches
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.vite
            node_modules/.astro
          key: astro-vite-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            astro-vite-${{ runner.os }}-
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - run: npm ci --prefer-offline --no-audit --fund=false
      # Chromium only (proof/OG/screenshots). Skip browser download on cache hit.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
      - run: npm run audit
      - run: npm run proof
      - run: npm run lhci
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: docs-proof
          path: docs/proof/
