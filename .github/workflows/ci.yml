name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build-time PUBLIC_* values (same names as Workers Builds / .env.example).
# Fallbacks in src/config also cover missing vars; CI sets them explicitly for consistency.
env:
  PUBLIC_SITE_URL: https://docuklin.com
  PUBLIC_SITE_NAME: Docuklin
  PUBLIC_SITE_SHORT_NAME: Docuklin
  PUBLIC_SITE_URL_PAYMENT_FEES: https://payment-fee-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_BUSINESS_DOCS: https://docuklin.com
  PUBLIC_SITE_URL_HOME_GARDEN: https://getyardtally.com
  PUBLIC_SITE_URL_FIBER_ARTS: https://fiber-arts-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_PET: https://pet-calculators.hammadiqbal117.workers.dev

jobs:
  # Keep this job id: previously used as a status check name on main.
  # No separate lint/typecheck scripts exist in package.json; build ‖ test cover the PR gate.
  build-test-audit-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Docs / agent-notes / proof-artifact-only PRs skip install/build/test.
      # Job id stays build-test-audit-proof so required checks remain green.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            heavy:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'astro.config.*'
              - 'tsconfig*.json'
              - 'vitest.config.*'
              - 'lighthouserc.*'
              - 'wrangler.*'
              - '.npmrc'
              - '.github/workflows/**'

      - name: Decide whether to run heavy checks
        id: gate
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.filter.outputs.heavy }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm

      # Skip npm ci when lockfile matches a prior warm cache (npm ci always wipes node_modules).
      - name: Cache node_modules
        if: steps.gate.outputs.run == 'true'
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true' && steps.nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # After install — npm ci would delete node_modules/.astro if restored earlier.
      - name: Cache Astro build output
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('astro.config.*', 'src/**/*', 'public/**/*', 'scripts/generate-og-svg.mjs', 'scripts/lib/**/*') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Vitest does not need dist/; overlap build and test wall time.
      - name: Build and test (parallel)
        if: steps.gate.outputs.run == 'true'
        run: |
          set +e
          npm run build &
          build_pid=$!
          npm test &
          test_pid=$!
          wait $build_pid
          build_status=$?
          wait $test_pid
          test_status=$?
          set -e
          if [[ $build_status -ne 0 || $test_status -ne 0 ]]; then
            echo "::error::build exit=${build_status} test exit=${test_status}"
            exit 1
          fi

      - name: Docs-only change — heavy checks skipped
        if: steps.gate.outputs.run != 'true'
        run: echo "No src/public/scripts/config/workflow changes; skipping install/build/test. Required check name unchanged."
