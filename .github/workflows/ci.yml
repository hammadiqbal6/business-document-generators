name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test-audit-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-proof
          path: docs/proof/
